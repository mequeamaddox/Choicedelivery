# Builds the driver phone app on Expo's servers (EAS Build) — start it from GitHub:
# Actions → "Build driver app" → Run workflow. Needs one repository secret, EXPO_TOKEN
# (expo.dev → Account settings → Access tokens). When it finishes, the run's summary has the
# download/install link.
name: Build driver app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "preview = installable test APK for your drivers; production = for the Play Store / App Store"
        type: choice
        options: [preview, production]
        default: preview

concurrency: driver-app-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4

      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add a repository secret named EXPO_TOKEN (Settings → Secrets and variables → Actions). See driver-app/README.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: driver-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Test the app's API client against the server
        run: npm test

      # Creates the Expo project on the first run (or links the existing one), without prompts.
      - name: Link Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest init --non-interactive --force

      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: '1'
        run: |
          npx --yes eas-cli@latest build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" \
            --non-interactive --json > build.json
          node -e '
            const builds = require("./build.json");
            const lines = ["## Driver app build", ""];
            for (const b of builds) {
              const file = b.artifacts?.applicationArchiveUrl || b.artifacts?.buildUrl;
              lines.push(`- **${b.platform}** (${b.status}): [Install / download](${file}) · [Build page](https://expo.dev/accounts/${b.project?.ownerAccount?.name}/projects/${b.project?.slug}/builds/${b.id})`);
            }
            lines.push("", "Android: open the Install link on the driver'"'"'s phone and allow installing from this source.");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
