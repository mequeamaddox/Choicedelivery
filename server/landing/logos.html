<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Choice Delivery SC Logos</title>
    <meta property="og:image" content="https://choicedeliverysc.com/logo-square.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body { margin: 0; padding: 16px; font-family: Arial, sans-serif; color: #111827; background: #fff; }
        h1 { font-size: 22px; }
        p { color: #4b5563; }
        img { display: block; width: 100%; max-width: 600px; height: auto; margin: 8px 0 28px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Choice Delivery SC logos</h1>
    <p>Press and hold a logo, then tap "Download image".</p>
    <h2>Square (1:1)</h2>
    <img src="https://choicedeliverysc.com/logo-square.png" width="1024" height="1024" alt="Choice Delivery SC square logo">
    <h2>Landscape (1.91:1)</h2>
    <img src="https://choicedeliverysc.com/logo-landscape.png" width="1200" height="628" alt="Choice Delivery SC landscape logo">
</body>
</html>
