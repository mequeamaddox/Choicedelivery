<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choice Delivery Courier Badge and Sticker</title>
<!-- ?item=badge-front|badge-back|sticker. Badge is CR80 (2.125" x 3.375") with 1/8" bleed. Sticker is a 3" circle. -->
<style>
  :root { --teal: #0f766e; --teal-dark: #115e59; --mint: #5eead4; --mint-light: #ccfbf1; --ink: #111827; --muted: #4b5563; --red: #c8102e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .badge { width: 2.375in; height: 3.625in; position: relative; overflow: hidden; background: #fff; }
  .safe { position: absolute; inset: 0.125in; }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 1.1in; background: linear-gradient(135deg, var(--mint) -40%, var(--teal) 65%); }
  .top img { position: absolute; left: 50%; top: 0.3in; width: 1.55in; transform: translateX(-50%); }
  .band { position: absolute; left: 0; right: 0; top: 1.1in; height: 0.24in; background: var(--red); color: #fff;
    font-size: 8.4pt; font-weight: 800; letter-spacing: 1.6pt; text-align: center; line-height: 0.24in; }
  .photo { position: absolute; left: 50%; top: 1.45in; width: 0.95in; height: 1.14in; transform: translateX(-50%);
    border: 1.5pt solid var(--teal); border-radius: 4pt; background: #f3f4f6; display: flex; align-items: center; justify-content: center;
    color: #9ca3af; font-size: 7pt; font-weight: 700; letter-spacing: 1pt; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .who { position: absolute; left: 0; right: 0; top: 2.67in; text-align: center; }
  .who .name { font-size: 11.5pt; font-weight: 800; line-height: 1.1; }
  .who .role { font-size: 7pt; color: var(--muted); margin-top: 0.02in; }
  .cert { display: inline-block; margin-top: 0.045in; padding: 0.012in 0.07in; border-radius: 99pt; background: var(--mint-light);
    color: var(--teal-dark); font-size: 5.8pt; font-weight: 800; letter-spacing: 0.3pt; }
  .back .certs { margin-top: 0.07in; font-size: 6.6pt; font-weight: 700; color: var(--teal-dark); line-height: 1.4; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 0.36in; background: var(--teal); color: #fff;
    font-size: 6.6pt; text-align: center; padding-top: 0.075in; line-height: 1.3; }
  .foot b { font-size: 7pt; }

  .back .head { position: absolute; left: 0; right: 0; top: 0; height: 0.66in; background: var(--teal); }
  .back .head img { position: absolute; left: 50%; top: 0.2in; width: 1.05in; transform: translateX(-50%); }
  .back .body { position: absolute; left: 0.24in; right: 0.24in; top: 0.8in; text-align: center; }
  .back h3 { font-size: 8pt; letter-spacing: 1.2pt; color: var(--teal); }
  .back p { font-size: 7pt; line-height: 1.4; margin-top: 0.05in; color: var(--ink); }
  .back .qr { width: 0.78in; display: block; margin: 0.08in auto 0.03in; }
  .back .small { font-size: 6pt; color: var(--muted); }
  .back .phone { font-size: 9pt; font-weight: 800; color: var(--teal); margin-top: 0.06in; }

  .sticker { width: 3in; height: 3in; }
</style>
</head>
<body>
<div id="out"></div>

<template id="badge-front">
  <div class="badge">
    <div class="top"><img src="logo-white.png" alt="Choice Delivery SC"></div>
    <div class="band">MEDICAL COURIER</div>
    <div class="photo"><img src="headshot.jpg" alt=""></div>
    <div class="who">
      <div class="name">Mequea Maddox</div>
      <div class="role">Owner · Authorized Courier</div>
      <div class="cert">✓ OSHA &amp; HIPAA CERTIFIED</div>
    </div>
    <div class="foot"><b>Choice Delivery LLC</b><br>choicedeliverysc.com</div>
  </div>
</template>

<template id="badge-back">
  <div class="badge back">
    <div class="head"><img src="logo-white.png" alt="Choice Delivery SC"></div>
    <div class="body">
      <h3>AUTHORIZED COURIER</h3>
      <p>The person pictured on the front picks up and delivers on behalf of Choice Delivery LLC.</p>
      <div class="certs">✓ OSHA Bloodborne Pathogens certified<br>✓ HIPAA certified</div>
      <div class="phone">Verify: (803) 949-7034</div>
      <img class="qr" src="card-qr.svg" alt="">
      <div class="small">If found, please text the number above<br>or return to Choice Delivery LLC.</div>
    </div>
    <div class="foot"><b>Choice Delivery LLC</b><br>choicedeliverysc.com</div>
  </div>
</template>

<template id="sticker">
  <svg class="sticker" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="-0.4" stop-color="#5eead4"/><stop offset="0.65" stop-color="#0f766e"/>
      </linearGradient>
      <path id="top" d="M 46 150 A 104 104 0 0 1 254 150"/>
      <path id="bot" d="M 36 150 A 114 114 0 0 0 264 150"/>
    </defs>
    <circle cx="150" cy="150" r="150" fill="url(#g)"/>
    <circle cx="150" cy="150" r="138" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="150" cy="150" r="82" fill="none" stroke="#ccfbf1" stroke-width="1" opacity="0.6"/>
    <text font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="21" letter-spacing="4" fill="#fff">
      <textPath href="#top" startOffset="50%" text-anchor="middle">MEDICAL COURIER</textPath>
    </text>
    <text font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#ccfbf1">
      <textPath href="#bot" startOffset="50%" text-anchor="middle">SAME-DAY · COLUMBIA, SC</textPath>
    </text>
    <image href="logo-white.png" x="72" y="122" width="156" height="56"/>
    <circle cx="44" cy="150" r="3.5" fill="#fff"/><circle cx="256" cy="150" r="3.5" fill="#fff"/>
  </svg>
</template>

<script>
  const item = new URLSearchParams(location.search).get('item') || 'badge-front';
  document.getElementById('out').appendChild(document.getElementById(item).content.cloneNode(true));
</script>
</body>
</html>
